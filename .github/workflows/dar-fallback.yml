name: DAR Cloud Fallback (public runner)

# 2026-11-11: every GH Actions job on the PRIVATE dar-brain repo stopped at
# 18:40Z on 10 Nov ("recent account payments have failed or your spending
# limit needs to be increased"). Standard runners in PUBLIC repos are free
# (docs.github.com, About billing for GitHub Actions), and a live probe on this
# public repo returned success 07:03:21Z. This workflow checks out the PRIVATE
# code with a PAT and runs the SAME gate-protected scripts.
# Guard job: skip entirely when the private cloud is healthy again.
# Preflight job: a pipeline may run only while its escrow is funded AND proofs=0,
# so a 20-minute cron can never create a second delivery.
# No new delivery logic here; the scripts own their own time gates.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs: {}

permissions:
  contents: read

concurrency:
  group: dar-cloud-fallback
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      skip: ${{ steps.h.outputs.skip }}
    steps:
      - id: h
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, datetime
          req = urllib.request.Request(
              "https://api.github.com/repos/dar-studio-agent/dar-brain/actions/runs?per_page=20",
              headers={"Authorization": "Bearer " + os.environ["GH_PAT"],
                       "User-Agent": "dar-fallback-guard",
                       "Accept": "application/vnd.github+json"})
          d = json.load(urllib.request.urlopen(req, timeout=30))
          now = datetime.datetime.now(datetime.timezone.utc)
          healthy = False
          newest = None
          for r in d.get("workflow_runs", []):
              ts = datetime.datetime.fromisoformat(r["created_at"].replace("Z", "+00:00"))
              if newest is None:
                  newest = r
              if r.get("conclusion") == "success" and (now - ts).total_seconds() < 2700:
                  healthy = True
                  break
          skip = 1 if healthy else 0
          print("private-cloud healthy=%s skip=%s newest=%s %s" % (
              healthy, skip, (newest or {}).get("created_at"), (newest or {}).get("conclusion")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=%d\n" % skip)
          PY

  fallback:
    needs: guard
    if: needs.guard.outputs.skip == '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: dar-studio-agent/dar-brain
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preflight - only escrows still funded with zero proofs
        id: pre
        env:
          SM_AGENT1_JSON: ${{ secrets.SM_AGENT1_JSON }}
          SM_AGENT2_JSON: ${{ secrets.SM_AGENT2_JSON }}
          SM_AGENT4_JSON: ${{ secrets.SM_AGENT4_JSON }}
          SM_AGENT5_JSON: ${{ secrets.SM_AGENT5_JSON }}
          SM_AGENT12_JSON: ${{ secrets.SM_AGENT12_JSON }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          targets = {
              "advisory": ("SM_AGENT2_JSON", "esc_398aa55c066b4102a9a50b79"),
              "fda":      ("SM_AGENT12_JSON", "esc_25b1a72cbe674fc0808f773a"),
              "listings": ("SM_AGENT5_JSON", "esc_5697b7070c014674ab57738a"),
              "ccdb":     ("SM_AGENT1_JSON", "esc_6dd09407dfc3465397b260e1"),
              "fmcsa":    ("SM_AGENT4_JSON", "esc_36ba58c282b74f2a837b9385"),
          }
          out = {}
          for name, (envname, eid) in targets.items():
              cfg = json.loads(os.environ[envname])
              key = cfg.get("key") or cfg.get("apiKey") or cfg.get("api_key")
              req = urllib.request.Request("https://synmerco.com/v1/escrows/" + eid,
                  headers={"Authorization": "Bearer " + key, "User-Agent": "dar-fallback-pre"})
              state, nproof = "unknown", -1
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      d = json.load(r)
                  e = d.get("escrow", d)
                  state, nproof = e.get("state"), len(e.get("proofs") or [])
              except Exception as ex:
                  print(name, "read error", type(ex).__name__)
              out[name] = 1 if (state == "funded" and nproof == 0) else 0
              print("PREFLIGHT %-9s state=%-10s proofs=%-2s eligible=%s" % (name, state, nproof, out[name]))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in out.items():
                  f.write("%s=%d\n" % (k, v))
          PY

      - name: Timed pulls (platform-driven, each script refuses a duplicate)
        env:
          SM_AGENT1_JSON: ${{ secrets.SM_AGENT1_JSON }}
          SM_AGENT2_JSON: ${{ secrets.SM_AGENT2_JSON }}
          SM_AGENT4_JSON: ${{ secrets.SM_AGENT4_JSON }}
          SM_AGENT12_JSON: ${{ secrets.SM_AGENT12_JSON }}
        run: |
          if [ "${{ steps.pre.outputs.advisory }}" = "1" ]; then python advisory_pull.py; echo "advisory_pull exit=$?"; fi
          if [ "${{ steps.pre.outputs.fda }}" = "1" ]; then python fda_pull.py; echo "fda_pull exit=$?"; fi
          if [ "${{ steps.pre.outputs.ccdb }}" = "1" ]; then python ccdb_pull.py; echo "ccdb_pull exit=$?"; fi
          if [ "${{ steps.pre.outputs.fmcsa }}" = "1" ]; then python fmcsa_pull.py; echo "fmcsa_pull exit=$?"; fi

      - name: Reports + gated deliveries (own time gates, no early submit)
        env:
          SM_AGENT1_JSON: ${{ secrets.SM_AGENT1_JSON }}
          SM_AGENT2_JSON: ${{ secrets.SM_AGENT2_JSON }}
          SM_AGENT4_JSON: ${{ secrets.SM_AGENT4_JSON }}
          SM_AGENT5_JSON: ${{ secrets.SM_AGENT5_JSON }}
          SM_AGENT12_JSON: ${{ secrets.SM_AGENT12_JSON }}
          GH_DELIVERABLES_TOKEN: ${{ secrets.GH_DELIVERABLES_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ "${{ steps.pre.outputs.advisory }}" = "1" ]; then python advisory_report.py --publish; echo "advisory_publish exit=$?"; fi
          if [ "${{ steps.pre.outputs.fda }}" = "1" ]; then python fda_report.py; echo "fda_report exit=$?"; fi
          if [ "${{ steps.pre.outputs.listings }}" = "1" ]; then python listings_delivery.py --publish; echo "listings_delivery exit=$?"; fi
          if [ "${{ steps.pre.outputs.ccdb }}" = "1" ]; then python ccdb_report.py --publish; echo "ccdb_publish exit=$?"; fi
          if [ "${{ steps.pre.outputs.fmcsa }}" = "1" ]; then python fmcsa_report.py --publish; echo "fmcsa_publish exit=$?"; fi

      - name: Radar + daily model audit (read only)
        env:
          SM_AGENT1_JSON: ${{ secrets.SM_AGENT1_JSON }}
          MODELS_KEYS_JSON: ${{ secrets.MODELS_KEYS_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python multimarket_radar.py; echo "radar exit=$?"
          python model_manager.py;      echo "model_manager exit=$?"

      - name: Supervisor + deadline notifier (Telegram)
        env:
          SM_AGENT1_JSON: ${{ secrets.SM_AGENT1_JSON }}
          SM_AGENT2_JSON: ${{ secrets.SM_AGENT2_JSON }}
          SM_AGENT3_JSON: ${{ secrets.SM_AGENT3_JSON }}
          SM_AGENT4_JSON: ${{ secrets.SM_AGENT4_JSON }}
          SM_AGENT5_JSON: ${{ secrets.SM_AGENT5_JSON }}
          SM_AGENT6_JSON: ${{ secrets.SM_AGENT6_JSON }}
          SM_AGENT7_JSON: ${{ secrets.SM_AGENT7_JSON }}
          SM_AGENT8_JSON: ${{ secrets.SM_AGENT8_JSON }}
          SM_AGENT9_JSON: ${{ secrets.SM_AGENT9_JSON }}
          SM_AGENT10_JSON: ${{ secrets.SM_AGENT10_JSON }}
          SM_AGENT11_JSON: ${{ secrets.SM_AGENT11_JSON }}
          SM_AGENT12_JSON: ${{ secrets.SM_AGENT12_JSON }}
          MODELS_KEYS_JSON: ${{ secrets.MODELS_KEYS_JSON }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python dar_vigil.py;         echo "vigil exit=$?"
          python deadline_notifier.py; echo "notifier exit=$?"

      - name: Brain (bids; dedupe lives in brain_state.json on origin/main)
        env:
          SM_AGENT1_JSON: ${{ secrets.SM_AGENT1_JSON }}
          SM_AGENT2_JSON: ${{ secrets.SM_AGENT2_JSON }}
          SM_AGENT3_JSON: ${{ secrets.SM_AGENT3_JSON }}
          SM_AGENT4_JSON: ${{ secrets.SM_AGENT4_JSON }}
          SM_AGENT5_JSON: ${{ secrets.SM_AGENT5_JSON }}
          SM_AGENT6_JSON: ${{ secrets.SM_AGENT6_JSON }}
          SM_AGENT7_JSON: ${{ secrets.SM_AGENT7_JSON }}
          SM_AGENT8_JSON: ${{ secrets.SM_AGENT8_JSON }}
          SM_AGENT9_JSON: ${{ secrets.SM_AGENT9_JSON }}
          SM_AGENT10_JSON: ${{ secrets.SM_AGENT10_JSON }}
          SM_AGENT11_JSON: ${{ secrets.SM_AGENT11_JSON }}
          SM_AGENT12_JSON: ${{ secrets.SM_AGENT12_JSON }}
          MODELS_KEYS_JSON: ${{ secrets.MODELS_KEYS_JSON }}
          GH_DELIVERABLES_TOKEN: ${{ secrets.GH_DELIVERABLES_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          MAX_OUTSTANDING_BIDS: "12"
          BID_ALL_AGENTS: "1"
        run: |
          python dar_brain.py; echo "brain exit=$?"

      - name: Persist artifacts back to the PRIVATE repo
        run: |
          git config user.name "dar-brain-fallback"
          git config user.email "dar-brain@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no new artifacts"
          else
            git commit -m "fallback artifacts $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push || echo "push failed - scripts also write via the API"
          fi
